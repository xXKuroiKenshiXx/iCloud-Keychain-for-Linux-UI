<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb4ff"/>
      <stop offset="0.55" stop-color="#2f80f5"/>
      <stop offset="1" stop-color="#1f5fe0"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0fd"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc94a"/>
      <stop offset="1" stop-color="#ff9f1a"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#0b1d3a" stroke-opacity=".08" stroke-width="1.5"/>

  <!-- key blade with two teeth -->
  <path d="M112 150 H144 V170 H160 Q166 170 166 176 V184 Q166 190 160 190 H144 V198 H156 Q162 198 162 204 V210 Q162 216 156 216 H144 V222 Q144 232 134 236 L128 238 L122 236 Q112 232 112 222 Z"
        fill="url(#body)"/>

  <!-- key bow: a penguin -->
  <path d="M128 30 C96 30 74 58 74 94 C74 128 96 156 128 156 C160 156 182 128 182 94 C182 58 160 30 128 30 Z" fill="url(#body)"/>
  <!-- belly doubles as the key hole -->
  <path d="M128 72 C110 72 98 90 98 110 C98 128 110 140 128 140 C146 140 158 128 158 110 C158 90 146 72 128 72 Z" fill="url(#belly)"/>
  <!-- eyes -->
  <circle cx="112" cy="62" r="8" fill="#ffffff"/>
  <circle cx="144" cy="62" r="8" fill="#ffffff"/>
  <circle cx="113.5" cy="63" r="3.6" fill="#10203d"/>
  <circle cx="145.5" cy="63" r="3.6" fill="#10203d"/>
  <!-- beak -->
  <path d="M117 78 Q128 70 139 78 Q133 90 128 91 Q123 90 117 78 Z" fill="url(#beak)"/>
  <!-- feet -->
  <ellipse cx="111" cy="156" rx="12" ry="6" fill="url(#beak)"/>
  <ellipse cx="145" cy="156" rx="12" ry="6" fill="url(#beak)"/>
</svg>
