<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cbcff"/>
      <stop offset="0.55" stop-color="#3f86f0"/>
      <stop offset="1" stop-color="#2459d6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe8f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b2a6b" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- glass tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="url(#sheen)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="2"/>

  <g filter="url(#shadow)">
    <!-- key shaft and teeth -->
    <path d="M118 140 L196 218 M168 190 L182 176 M184 206 L196 194"
          fill="none" stroke="url(#metal)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- key bow: a penguin head -->
    <ellipse cx="92" cy="108" rx="54" ry="58" fill="#14203a"/>
    <path d="M92 88 C86 76 70 74 63 88 C58 98 60 116 66 128 C72 140 82 147 92 147 C102 147 112 140 118 128 C124 116 126 98 121 88 C114 74 98 76 92 88 Z"
          fill="url(#metal)"/>
    <circle cx="79" cy="104" r="7" fill="#14203a"/>
    <circle cx="105" cy="104" r="7" fill="#14203a"/>
    <circle cx="81" cy="102" r="2.3" fill="#ffffff"/>
    <circle cx="107" cy="102" r="2.3" fill="#ffffff"/>
    <path d="M81 119 Q92 113 103 119 Q92 133 81 119 Z" fill="#ffb43a"/>
  </g>
</svg>
